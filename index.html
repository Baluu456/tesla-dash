<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Tesla Dash</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;600;700&family=Share+Tech+Mono&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --panel: #0f0f1a;
    --border: #1e2040;
    --accent: #c8f000;
    --accent2: #00e5ff;
    --red: #ff3b5c;
    --text: #e8eaf0;
    --muted: #4a5070;
    --glow: rgba(200, 240, 0, 0.15);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    overflow: hidden;
    touch-action: manipulation;
  }

  /* SETUP SCREEN */
  #setup {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    padding: 32px;
    gap: 20px;
  }

  #setup h1 {
    font-size: 2.2rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: var(--accent);
    text-transform: uppercase;
  }

  #setup p {
    color: var(--muted);
    font-size: 1rem;
    text-align: center;
    line-height: 1.5;
  }

  .input-group {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .input-group label {
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .input-group input, .input-group select {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.72rem;
    padding: 10px 14px;
    outline: none;
    width: 100%;
    transition: border-color 0.2s;
  }

  .input-group input:focus {
    border-color: var(--accent);
  }

  .btn {
    background: var(--accent);
    color: #0a0a0f;
    border: none;
    border-radius: 6px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    padding: 14px 32px;
    cursor: pointer;
    text-transform: uppercase;
    transition: opacity 0.2s;
    width: 100%;
    max-width: 480px;
  }

  .btn:active { opacity: 0.7; }

  .btn-outline {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.85rem;
    padding: 10px 24px;
  }

  #status-msg {
    font-size: 0.85rem;
    color: var(--muted);
    text-align: center;
    min-height: 20px;
  }

  #status-msg.error { color: var(--red); }
  #status-msg.ok { color: var(--accent); }

  /* DASHBOARD */
  #dash {
    display: none;
    width: 100vw;
    height: 100vh;
    display: none;
    flex-direction: column;
    padding: 12px;
    gap: 10px;
  }

  /* TOP BAR */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4px;
  }

  .car-name {
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
  }

  .update-info {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    display: inline-block;
    margin-right: 6px;
  }

  .status-dot.online { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .status-dot.offline { background: var(--red); }

  /* MAIN GRID */
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto;
    gap: 10px;
    flex: 1;
  }

  /* SPEED CARD — full width */
  .speed-card {
    grid-column: 1 / -1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }

  .speed-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }

  .speed-main {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .speed-value {
    font-size: 5rem;
    font-weight: 700;
    line-height: 1;
    color: var(--accent);
    text-shadow: 0 0 30px rgba(200,240,0,0.4);
    letter-spacing: -2px;
    transition: all 0.3s;
  }

  .speed-unit {
    font-size: 0.9rem;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .gear-display {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .gear-label {
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .gear-value {
    font-size: 3.5rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
    transition: color 0.3s;
  }

  .gear-value.reverse { color: var(--red); }
  .gear-value.drive { color: var(--accent2); }
  .gear-value.park { color: var(--muted); }

  /* BATTERY CARD */
  .battery-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .card-label {
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .battery-percent {
    font-size: 2.8rem;
    font-weight: 700;
    line-height: 1;
    transition: color 0.5s;
  }

  .battery-bar-wrap {
    background: var(--border);
    border-radius: 4px;
    height: 6px;
    overflow: hidden;
  }

  .battery-bar {
    height: 100%;
    border-radius: 4px;
    background: var(--accent);
    transition: width 0.8s ease, background 0.5s;
  }

  .battery-range {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
    color: var(--muted);
  }

  /* INFO CARD */
  .info-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .info-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }

  .info-row:last-child { border-bottom: none; }

  .info-key {
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .info-val {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.85rem;
    color: var(--text);
  }

  .info-val.accent { color: var(--accent); }
  .info-val.red { color: var(--red); }
  .info-val.blue { color: var(--accent2); }

  /* BOTTOM ROW */
  .bottom-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  .mini-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .mini-icon {
    font-size: 1.4rem;
    line-height: 1;
  }

  .mini-label {
    font-size: 0.55rem;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
    text-align: center;
  }

  .mini-val {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
    color: var(--text);
    text-align: center;
  }

  /* CHARGING INDICATOR */
  .charging-badge {
    display: none;
    background: rgba(200,240,0,0.1);
    border: 1px solid var(--accent);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 0.7rem;
    color: var(--accent);
    letter-spacing: 0.1em;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* SLEEP OVERLAY */
  #sleep-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(10,10,15,0.92);
    z-index: 10;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    backdrop-filter: blur(4px);
  }

  #sleep-overlay.show {
    display: flex;
  }

  #sleep-overlay p {
    color: var(--muted);
    font-size: 1rem;
    letter-spacing: 0.1em;
    text-align: center;
  }

  .spin {
    width: 40px; height: 40px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Settings button */
  .settings-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 0.75rem;
    cursor: pointer;
    font-family: 'Rajdhani', sans-serif;
    letter-spacing: 0.1em;
  }

  .settings-btn:active { opacity: 0.6; }
</style>
</head>
<body>

<!-- SETUP SCREEN -->
<div id="setup">
  <h1>⚡ Tesla Dash</h1>
  <p>Введи данные для подключения к своей машине</p>

  <div class="input-group">
    <label>Refresh Token</label>
    <input type="text" id="inp-refresh" placeholder="eyJh..." autocomplete="off" spellcheck="false">
  </div>

  <div class="input-group">
    <label>Vehicle ID</label>
    <input type="text" id="inp-vid" placeholder="1493071406010646" autocomplete="off">
  </div>

  <div class="input-group">
    <label>Регион</label>
    <select id="inp-region">
      <option value="https://owner-api.teslamotors.com">Глобальный (owner-api)</option>
      <option value="https://fleet-api.prd.na.vn.cloud.tesla.com">Северная Америка (Fleet)</option>
      <option value="https://fleet-api.prd.eu.vn.cloud.tesla.com">Европа (Fleet)</option>
    </select>
  </div>

  <button class="btn" onclick="connect()">Подключиться</button>
  <div id="status-msg"></div>
  <button class="btn btn-outline" onclick="loadSaved()">Загрузить сохранённые данные</button>
</div>

<!-- DASHBOARD -->
<div id="dash">
  <div id="sleep-overlay">
    <div class="spin"></div>
    <p>Машина спит...<br>Пробуждаю</p>
  </div>

  <div class="topbar">
    <div>
      <span class="status-dot" id="dot"></span>
      <span class="car-name" id="car-name">Tesla</span>
      <span class="charging-badge" id="charging-badge">⚡ ЗАРЯД</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="update-info" id="update-time">—</span>
      <button class="settings-btn" onclick="showSetup()">⚙</button>
    </div>
  </div>

  <div class="main-grid">
    <!-- SPEED -->
    <div class="speed-card">
      <div class="speed-main">
        <div class="speed-value" id="speed">0</div>
        <div class="speed-unit">км/ч</div>
      </div>
      <div class="gear-display">
        <div class="gear-label">Передача</div>
        <div class="gear-value park" id="gear">P</div>
      </div>
    </div>

    <!-- BATTERY -->
    <div class="battery-card">
      <div class="card-label">Батарея</div>
      <div class="battery-percent" id="battery-pct">—%</div>
      <div class="battery-bar-wrap">
        <div class="battery-bar" id="battery-bar" style="width:0%"></div>
      </div>
      <div class="battery-range" id="battery-range">— км запаса</div>
    </div>

    <!-- INFO -->
    <div class="info-card">
      <div class="card-label">Данные</div>
      <div class="info-row">
        <span class="info-key">Темп. салон</span>
        <span class="info-val accent" id="temp-in">—°C</span>
      </div>
      <div class="info-row">
        <span class="info-key">Темп. снаружи</span>
        <span class="info-val" id="temp-out">—°C</span>
      </div>
      <div class="info-row">
        <span class="info-key">Одометр</span>
        <span class="info-val blue" id="odometer">— км</span>
      </div>
    </div>
  </div>

  <!-- BOTTOM ROW -->
  <div class="bottom-row">
    <div class="mini-card">
      <div class="mini-icon">🔒</div>
      <div class="mini-label">Замки</div>
      <div class="mini-val" id="locks">—</div>
    </div>
    <div class="mini-card">
      <div class="mini-icon">🚪</div>
      <div class="mini-label">Двери</div>
      <div class="mini-val" id="doors">—</div>
    </div>
    <div class="mini-card">
      <div class="mini-icon">🌡️</div>
      <div class="mini-label">Батарея</div>
      <div class="mini-val" id="bat-temp">—°C</div>
    </div>
    <div class="mini-card">
      <div class="mini-icon">⚡</div>
      <div class="mini-label">Мощность</div>
      <div class="mini-val" id="power">— кВт</div>
    </div>
  </div>
</div>

<script>
  let refreshToken = '';
  let accessToken = '';
  let vehicleId = '';
  let baseUrl = '';
  let updateTimer = null;
  let carDisplayName = 'Tesla';

  function showSetup() {
    document.getElementById('setup').style.display = 'flex';
    document.getElementById('dash').style.display = 'none';
    if (updateTimer) clearInterval(updateTimer);
  }

  function setStatus(msg, type = '') {
    const el = document.getElementById('status-msg');
    el.textContent = msg;
    el.className = type;
  }

  function loadSaved() {
    const saved = localStorage.getItem('tesla_dash_config');
    if (saved) {
      const cfg = JSON.parse(saved);
      document.getElementById('inp-refresh').value = cfg.refresh || '';
      document.getElementById('inp-vid').value = cfg.vid || '';
      document.getElementById('inp-region').value = cfg.base || 'https://owner-api.teslamotors.com';
      setStatus('Данные загружены', 'ok');
    } else {
      setStatus('Нет сохранённых данных', 'error');
    }
  }

  async function getNewAccessToken(rToken, base) {
    const resp = await fetch('https://auth.tesla.com/oauth2/v3/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        grant_type: 'refresh_token',
        client_id: 'ownerapi',
        refresh_token: rToken,
        scope: 'openid email offline_access'
      })
    });
    if (!resp.ok) throw new Error('Ошибка обновления токена: ' + resp.status);
    const data = await resp.json();
    return data.access_token;
  }

  async function wakeVehicle() {
    document.getElementById('sleep-overlay').classList.add('show');
    try {
      await fetch(`${baseUrl}/api/1/vehicles/${vehicleId}/wake_up`, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' }
      });
      // Wait for wake
      for (let i = 0; i < 20; i++) {
        await new Promise(r => setTimeout(r, 2000));
        const check = await fetch(`${baseUrl}/api/1/vehicles/${vehicleId}`, {
          headers: { 'Authorization': 'Bearer ' + accessToken }
        });
        const d = await check.json();
        if (d.response && d.response.state === 'online') break;
      }
    } finally {
      document.getElementById('sleep-overlay').classList.remove('show');
    }
  }

  async function connect() {
    const rToken = document.getElementById('inp-refresh').value.trim();
    const vid = document.getElementById('inp-vid').value.trim();
    const base = document.getElementById('inp-region').value;

    if (!rToken || !vid) {
      setStatus('Заполни все поля', 'error');
      return;
    }

    setStatus('Получаю access token...', '');

    try {
      const aToken = await getNewAccessToken(rToken, base);

      setStatus('Проверяю машину...', '');

      // Get vehicle info
      const vResp = await fetch(`${base}/api/1/vehicles`, {
        headers: { 'Authorization': 'Bearer ' + aToken }
      });
      const vData = await vResp.json();

      if (!vData.response || vData.response.length === 0) {
        setStatus('Машины не найдены в аккаунте', 'error');
        return;
      }

      // Find vehicle
      const vehicle = vData.response.find(v => String(v.id) === String(vid)) || vData.response[0];
      carDisplayName = vehicle.display_name || 'Tesla';

      // Save config
      refreshToken = rToken;
      accessToken = aToken;
      vehicleId = String(vehicle.id);
      baseUrl = base;

      localStorage.setItem('tesla_dash_config', JSON.stringify({ refresh: rToken, vid: vehicleId, base }));

      // Show dash
      document.getElementById('setup').style.display = 'none';
      document.getElementById('dash').style.display = 'flex';
      document.getElementById('car-name').textContent = carDisplayName;

      // Wake if needed
      if (vehicle.state !== 'online') {
        await wakeVehicle();
      }

      // Start polling
      await fetchData();
      updateTimer = setInterval(fetchData, 3000);

    } catch (e) {
      setStatus('Ошибка: ' + e.message, 'error');
    }
  }

  async function fetchData() {
    try {
      // Refresh token if needed
      let headers = { 'Authorization': 'Bearer ' + accessToken };

      const resp = await fetch(`${baseUrl}/api/1/vehicles/${vehicleId}/vehicle_data`, { headers });

      if (resp.status === 401) {
        // Token expired, refresh
        accessToken = await getNewAccessToken(refreshToken, baseUrl);
        headers = { 'Authorization': 'Bearer ' + accessToken };
        const resp2 = await fetch(`${baseUrl}/api/1/vehicles/${vehicleId}/vehicle_data`, { headers });
        updateDash(await resp2.json());
      } else if (resp.status === 408) {
        // Car asleep
        await wakeVehicle();
        return;
      } else {
        updateDash(await resp.json());
      }

    } catch (e) {
      document.getElementById('dot').className = 'status-dot offline';
      console.error(e);
    }
  }

  function updateDash(data) {
    if (!data.response) return;
    const r = data.response;

    document.getElementById('dot').className = 'status-dot online';

    const now = new Date();
    document.getElementById('update-time').textContent =
      now.getHours().toString().padStart(2,'0') + ':' +
      now.getMinutes().toString().padStart(2,'0') + ':' +
      now.getSeconds().toString().padStart(2,'0');

    // Drive state
    const drive = r.drive_state || {};
    const speedMs = drive.speed || 0;
    const speedKmh = Math.round(speedMs * 3.6);
    document.getElementById('speed').textContent = speedKmh;

    const gearEl = document.getElementById('gear');
    const shift = drive.shift_state || 'P';
    gearEl.textContent = shift || 'P';
    gearEl.className = 'gear-value ' +
      (shift === 'R' ? 'reverse' : shift === 'D' ? 'drive' : 'park');

    // Power kW
    const powerKw = drive.power ? Math.round(drive.power) : 0;
    document.getElementById('power').textContent = (powerKw > 0 ? '+' : '') + powerKw + ' кВт';

    // Charge state
    const charge = r.charge_state || {};
    const pct = charge.battery_level || 0;
    const range = charge.est_battery_range
      ? Math.round(charge.est_battery_range * 1.60934)
      : (charge.battery_range ? Math.round(charge.battery_range * 1.60934) : 0);

    document.getElementById('battery-pct').textContent = pct + '%';
    document.getElementById('battery-range').textContent = range + ' км запаса';

    const bar = document.getElementById('battery-bar');
    bar.style.width = pct + '%';
    bar.style.background = pct > 50 ? 'var(--accent)' : pct > 20 ? '#ffb300' : 'var(--red)';

    const pctEl = document.getElementById('battery-pct');
    pctEl.style.color = pct > 50 ? 'var(--accent)' : pct > 20 ? '#ffb300' : 'var(--red)';

    const isCharging = charge.charging_state === 'Charging';
    document.getElementById('charging-badge').style.display = isCharging ? 'inline-block' : 'none';

    // Climate
    const climate = r.climate_state || {};
    const tempIn = climate.inside_temp != null ? climate.inside_temp.toFixed(1) + '°C' : '—°C';
    const tempOut = climate.outside_temp != null ? climate.outside_temp.toFixed(1) + '°C' : '—°C';
    document.getElementById('temp-in').textContent = tempIn;
    document.getElementById('temp-out').textContent = tempOut;

    // Vehicle state
    const vs = r.vehicle_state || {};
    const odo = vs.odometer ? Math.round(vs.odometer * 1.60934).toLocaleString('ru') + ' км' : '— км';
    document.getElementById('odometer').textContent = odo;

    const locked = vs.locked;
    const lockEl = document.getElementById('locks');
    lockEl.textContent = locked == null ? '—' : locked ? 'Закрыт' : 'Открыт';
    lockEl.className = 'mini-val ' + (locked ? '' : 'red');

    // Doors
    const anyOpen = vs.df || vs.dr || vs.pf || vs.pr;
    const doorsEl = document.getElementById('doors');
    doorsEl.textContent = anyOpen ? 'Открыты' : 'Закрыты';
    doorsEl.className = 'mini-val ' + (anyOpen ? 'red' : '');

    // Battery temp
    const batTemp = charge.battery_heater_on != null
      ? (charge.battery_heater_on ? 'Прогрев' : '—') : '—';
    document.getElementById('bat-temp').textContent = batTemp;
  }

  // Auto-load on start
  window.onload = () => {
    const saved = localStorage.getItem('tesla_dash_config');
    if (saved) {
      const cfg = JSON.parse(saved);
      document.getElementById('inp-refresh').value = cfg.refresh || '';
      document.getElementById('inp-vid').value = cfg.vid || '';
      if (cfg.base) document.getElementById('inp-region').value = cfg.base;
    }
  };
</script>
</body>
</html>
